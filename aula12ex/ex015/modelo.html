<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>

    <section>
        <div>
            <p>Ano de Nascimento: 
                <input type="number" name="txtano" id="txtano" min="1">
            </p>

            <p>Sexo: 
                <input class="botao" type="radio" name="radsex" id="mas" checked>
                <label class="botao" for="mas">Masculino</label>

                <input class="botao" type="radio" name="radsex" id="fem">
                <label class="botao" for="fem">Feminino</label>
            </p>

            <p>
                <input class="botao" id="botao-verificar" type="button" value="Verificar" onclick="verificar()">
            </p>
        </div>

        <div id="res">
            Preencha os dados acima para ver o resultado!
        </div>
    </section>

    <footer>
        <p>&copy; <i>CursoemVideo</i></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
